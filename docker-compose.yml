version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autonomous_ai_pg
    environment:
      POSTGRES_USER: ${DB_USER:-aiagent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aiagent_secret}
      POSTGRES_DB: ${DB_NAME:-autonomous_ai}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
